<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
<body>
   <div class="container vh-100">
        <div class="row h-100 align-items-center">
            <div class="col-12 col-md-6 text-center mb-4 mb-md-0">
                <img src="/assets/images/logos/logo-secundario.png" alt="logo da aplicação" class="img-fluid">
            </div>

            <div class="col-12 col-md-6">
                <div class="card p-4">
                    <form>
                        <h2>Olá, que bom que você voltou!</h2>
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">EMAIL</label>
                            <input type="email" class="form-control" id="inputEmail" placeholder="nome@seuemail.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="inputSenha" class="form-label">SENHA</label>
                            <input type="senha" class="form-control" id="inputSenha" required>
                        </div>

                        <button class="btn btn-primary w-100 mb-3">Entrar</button>

                        <p class="text-center">OU</p>

                        <div class="d-flex mb-3 gap-3">
                            <button class="btn btn-secondary w-100">
                                Entrar com Google
                            </button>
                            <button class="btn btn-secondary w-100">
                                Entrar com Apple
                            </button>
                        </div>

                        <p class="text-center">Ainda não faz parte? Cadastre-se</p>
                    </form>
                </div>
            </div>
        </div>
   </div>

    <script defer src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
