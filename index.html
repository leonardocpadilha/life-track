<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeTrack - Fazer Login</title>

    <link
      rel="icon"
      href="./assets/img/logos/logo-icone-primario.webp"
      type="image/x-icon"
    />

    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/main.css" />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body class="auth-page">
    <div class="container vh-100">
      <div class="row h-100 align-items-center">
        <div class="col-12 col-lg-6 text-center mb-4 mb-md-0">
          <img
            src="./assets/img/logos/logo-secundario.webp"
            alt="Logo da aplicação"
            class="img-fluid"
          />
        </div>

        <div class="col-12 col-lg-6">
          <div class="card p-4 mb-3 mb-md-0">
            <form class="form-autentication">
              <h1 class="mb-3">Olá, que bom que você voltou!</h1>
              <div class="mb-3">
                <label for="inputEmail" class="form-label fw-semibold"
                  >EMAIL</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="inputEmail"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="inputSenha" class="form-label fw-semibold"
                  >SENHA</label
                >
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control"
                    id="inputSenha"
                    required
                  />
                  <button
                    type="button"
                    id="toggleSenha"
                    class="input-group-text"
                  >
                    <iconify-icon
                      icon="heroicons-solid:eye"
                      id="iconeSenha"
                    ></iconify-icon>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-lt-primary w-100 mb-3">
                <a href="timeline.html">Entrar</a>
              </button>

              <p class="text-center">OU</p>

              <div class="d-flex mb-3 gap-3">
                <button
                  class="btn btn-login-social btn-surface w-100 d-flex align-items-center justify-content-center gap-1"
                >
                  <iconify-icon
                    icon="material-icon-theme:google"
                  ></iconify-icon>
                  Entrar com Google
                </button>

                <button
                  class="btn btn-login-social btn-surface w-100 d-flex align-items-center justify-content-center gap-1"
                >
                  <iconify-icon icon="devicon:apple"></iconify-icon>
                  Entrar com Apple
                </button>
              </div>

              <p class="mb-0 text-center">
                Ainda não faz parte? <a class="text-link" href="cadastro.html">Cadastre-se</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
