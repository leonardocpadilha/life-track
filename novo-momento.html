<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Momento</title>

    <link
      rel="icon"
      href="/assets/img/logos/logo-icone-primario.webp"
      type="image/x-icon"
    />

    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/main.css" />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>

  <body class="novo-momento-page">
    <nav class="navbar navbar-lt rounded-pill p-0">
      <div class="container">
        <div class="logo">
          <a class="navbar-brand m-0" href="#">
            <img
              src="/assets/img/logos/logo-primario.webp"
              alt="Logo LifeTrack"
              width="150"
            />
          </a>
        </div>
        <div class="links d-none d-md-flex">
          <ul class="navbar-nav d-flex flex-row">
            <li class="nav-item mx-3">
              <a class="nav-link active d-flex flex-column align-items-center" href="novo-momento.html">
                <iconify-icon
                    icon="material-symbols:add-box"
                ></iconify-icon>
                Registrar
              </a>
            </li>
            <li class="nav-item mx-3">
              <a class="nav-link d-flex flex-column align-items-center" href="#">
                <iconify-icon
                    icon="material-symbols:calendar-clock"
                ></iconify-icon>
                Timeline
              </a>
            </li>
            <li class="nav-item mx-3">
              <a class="nav-link d-flex flex-column align-items-center" href="#">
                <iconify-icon
                    icon="material-symbols:chart-data"
                ></iconify-icon>
                Jornada
              </a>
            </li>
          </ul>
        </div>
        <div class="user">
          <button class="btn rounded-pill btn-lt-user d-flex align-items-center gap-2">
            <div class="avatar-circle rounded-circle">
              <iconify-icon 
              icon="fa6-solid:user"
              ></iconify-icon>
            </div>
            <span class="user-name">Usuário</span>
          </button>
        </div>
      </div>
    </nav>

    <nav class="navbar navbar-lt-mobile rounded-pill fixed-bottom d-flex d-md-none p-0">
      <div class="container justify-content-center">
        <ul class="navbar-nav d-flex flex-row justify-content-around w-100 m-0 p-0">
          <li class="nav-item text-center">
            <a class="nav-link active d-flex flex-column align-items-center" href="novo-momento.html">
              <iconify-icon icon="material-symbols:add-box" class="fs-3"></iconify-icon>
              Registrar
            </a>
          </li>
          <li class="nav-item text-center">
            <a class="nav-link d-flex flex-column align-items-center" href="#">
              <iconify-icon icon="material-symbols:calendar-clock" class="fs-3"></iconify-icon>
              Timeline
            </a>
          </li>
          <li class="nav-item text-center">
            <a class="nav-link d-flex flex-column align-items-center" href="#">
              <iconify-icon icon="material-symbols:chart-data" class="fs-3"></iconify-icon>
              Jornada
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main
      class="d-flex justify-content-center align-items-center min-vh-100 p-3 p-lg-0"
    >
      <form class="form-novo-momento w-100">
        <div class="container content-area p-4">
          <div class="row align-items-stretch">
            <div
              class="col-12 col-md-12 col-lg-5 d-flex flex-column justify-content-between"
            >
              <div class="card-pre-imagem flex-grow-1 d-flex flex-column">
                <label for="inputImage" class="form-label fw-semibold mb-2"
                  >PRÉ-VISUALIZAÇÃO DE IMAGEM</label
                >

                <div class="upload-area flex-grow-1">
                  <p class="upload-text">
                    Quer guardar uma imagem desse momento?
                  </p>

                  <iconify-icon
                    icon="material-symbols:cloud-upload"
                  ></iconify-icon>

                  <input
                    type="file"
                    class="form-control d-none"
                    id="inputImage"
                    accept="image/*"
                  />
                  <label for="inputImage" class="btn btn-lt-primary px-4"
                    >Upload de Imagem</label
                  >
                </div>
              </div>

              <div
                class="more-info d-flex justify-content-center align-items-center gap-3 mt-3"
              >
                <button class="btn-lt-icon">
                  <iconify-icon
                    icon="material-symbols:bookmark-add"
                  ></iconify-icon>
                </button>
                <button class="btn-lt-icon">
                  <iconify-icon icon="material-symbols:numbers"></iconify-icon>
                </button>
                <button class="btn-lt-icon">
                  <iconify-icon
                    icon="material-symbols:add-reaction"
                  ></iconify-icon>
                </button>
                <button class="btn-lt-icon">
                  <iconify-icon
                    icon="material-symbols:add-location-alt"
                  ></iconify-icon>
                </button>
              </div>
            </div>

            <div
              class="col-12 col-md-12 col-lg-7 d-flex flex-column justify-content-between"
            >
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-8 col-lg-8">
                  <label for="inputTitle" class="form-label fw-semibold mb-2"
                    >TÍTULO</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="inputTitle"
                    placeholder="Como você chamaria esse momento?"
                    required
                  />
                </div>
                <div class="col-12 col-md-4 col-lg-4">
                  <label for="inputDate" class="form-label fw-semibold mb-2"
                    >DATA</label
                  >
                  <input
                    type="date"
                    class="form-control text-center"
                    id="inputDate"
                    required
                  />
                </div>
              </div>

              <div class="d-flex flex-column flex-grow-1 mb-3">
                <label for="inputDescricao" class="form-label fw-semibold mb-2"
                  >DESCRIÇÃO</label
                >
                <textarea
                  name="inputDescricao"
                  id="inputDescricao"
                  class="form-control flex-grow-1"
                  placeholder="Conte um pouco mais sobre esse momento..."
                ></textarea>
              </div>

              <div>
                <button class="btn btn-lt-primary w-100">
                  Registrar momento
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <footer class="bg-primary mt-auto py-4">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3"
        >
          <img
            src="/assets/img/logos/logo-secundario.webp"
            alt="logo da aplicação"
            class="img-fluid"
          />

          <p class="mb-0">Política de Privacidade</p>

          <p class="mb-0">Política de Cookies</p>

          <p class="mb-0">Termos e Condições</p>
        </div>

        <div class="mt-4">
          <p class="mb-0 small">
            &copy; 2026 LifeTrack - Todos os direitos reservados
          </p>
        </div>
      </div>
    </footer>

    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="assets/js/novo-momento.js"></script>
  </body>
</html>
