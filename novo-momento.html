<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Momento</title>

    <link
      rel="icon"
      href="/assets/img/logos/logo-icone-primario.webp"
      type="image/x-icon"
    />

    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/main.css" />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>

  <body class="novo-momento-page">
    <main class="d-flex justify-content-center align-items-center min-vh-100">
      <form class="form-novo-momento">
        <div class="container">
          <div class="row h-100 align-items-stretch">
            <div class="col-5">
              <div class="card-pre-imagem h-100">
                <label for="inputImage" class="form-label fw-semibold"
                  >PRÉ-VISUALIZAÇÃO DE IMAGEM</label
                >
                <input
                  type="file"
                  class="form-control"
                  id="inputImage"
                  placeholder="Quer guardar uma imagem desse momento?"
                />
              </div>
            </div>
            <div class="col-7">
              <div class="row">
                <div class="col-8">
                  <label for="inputTitle" class="form-label fw-semibold"
                    >TÍTULO</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="inputTitle"
                    placeholder="Como você chamaria esse momento?"
                    required
                  />
                </div>
                <div class="col-4 mb-3">
                  <label for="inputDate" class="form-label fw-semibold"
                    >DATA</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="inputDate"
                    required
                  />
                </div>
              </div>
              <div class="row">
                <div class="col-12 mb-3">
                  <label for="inputDescricao" class="form-label fw-semibold"
                    >DESCRIÇÃO</label
                  >
                  <textarea
                    name="inputDescricao"
                    id="inputDescricao"
                    class="form-control"
                    rows="8"
                    placeholder="Conte um pouco mais sobre esse momento..."
                  ></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>

    <footer class="bg-primary mt-auto py-4">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3"
        >
          <img
            src="/assets/img/logos/logo-secundario.webp"
            alt="logo da aplicação"
            class="img-fluid"
          />

          <p class="mb-0">Política de Privacidade</p>

          <p class="mb-0">Política de Cookies</p>

          <p class="mb-0">Termos e Condições</p>
        </div>

        <div class="mt-4">
          <p class="mb-0 small">
            &copy; 2026 LifeTrack - Todos os direitos reservados
          </p>
        </div>
      </div>
    </footer>
    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
